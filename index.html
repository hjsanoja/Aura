<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura · Catálogo</title>
<meta name="description" content="Catálogo de ropa deportiva Aura Activewear">
<meta name="theme-color" content="#181512">
<meta name="color-scheme" content="light">

<!-- PWA / iPhone -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aura">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<a class="skip" href="#content">Saltar al catálogo</a>

<header class="hero">
  <div class="hero-top">
    <span class="demo-badge" id="demoBadge" hidden>Demo</span>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Menú" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>
  <h1 class="logo">AURA</h1>
  <div class="logo-line" aria-hidden="true"></div>
  <p class="logo-sub">Activewear · Catálogo</p>
  <dl class="stats" aria-label="Resumen del catálogo">
    <div><dt>Modelos</dt><dd id="stModels">–</dd></div>
    <div><dt>Unidades</dt><dd id="stUnits">–</dd></div>
    <div><dt>Marcas</dt><dd id="stBrands">–</dd></div>
  </dl>
</header>

<div class="banner" id="banner" role="status" hidden></div>

<div class="searchbar">
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span class="sr-only">Buscar</span>
    <input id="q" type="search" placeholder="Buscar producto, marca o color" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="qClear" type="button" aria-label="Borrar búsqueda" hidden>×</button>
  </label>
</div>

<nav class="filters" id="filters" aria-label="Filtros"></nav>

<div class="meta">
  <span id="count" aria-live="polite"></span>
  <span class="meta-right">
    <span id="updated"></span>
    <button class="refresh" id="refreshBtn" type="button" aria-label="Actualizar catálogo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </span>
</div>

<main id="content" tabindex="-1"></main>

<footer class="foot">AURA · ACTIVEWEAR</footer>

<dialog class="sheet" id="menu" aria-labelledby="menuTitle">
  <div class="sheet-grip" aria-hidden="true"></div>
  <h2 id="menuTitle" class="sheet-title">Menú</h2>
  <button class="sheet-item" type="button" data-act="refresh">Actualizar catálogo</button>
  <button class="sheet-item" type="button" data-act="update">Buscar actualización de la app</button>
  <button class="sheet-item" type="button" data-act="install" id="installItem" hidden>Instalar app</button>
  <p class="sheet-note" id="versionNote"></p>
  <button class="btn btn-ghost" type="button" data-act="close">Cerrar</button>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
